<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ToolToolNam — Simple Android Apps</title>
    <meta name="description" content="Simple, focused Android apps by ToolToolNam. Lightweight tools that each do one thing well.">
    <link rel="canonical" href="https://tooltoolnam.github.io/">
    <meta property="og:title" content="ToolToolNam — Simple Android Apps">
    <meta property="og:description" content="Simple, focused Android apps. Lightweight tools that do one thing well.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://tooltoolnam.github.io/">
    <meta property="og:image" content="https://tooltoolnam.github.io/ttm_f_logo.png">
    <meta property="og:site_name" content="ToolToolNam">
    <meta name="twitter:card" content="summary">
    <link rel="icon" href="ttm_f_logo.png">
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        :root{
            --bg:#0b0d10; --card:#14171c; --fg:#f2f4f7; --dim:#9aa4b2;
            --border:#232830; --accent:#00d4aa; --g1:#00d4aa; --g2:#00a3ff;
        }
        html{-webkit-text-size-adjust:100%}
        body{
            font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
            background:var(--bg); color:var(--fg); line-height:1.6;
            min-height:100dvh; display:flex; flex-direction:column;
            align-items:center; justify-content:center; padding:2rem 1.5rem; text-align:center;
        }
        .bg{position:fixed;inset:0;z-index:-1;overflow:hidden}
        .orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:.18}
        .orb-1{width:380px;height:380px;background:var(--g1);top:-100px;left:-80px}
        .orb-2{width:320px;height:320px;background:var(--g2);bottom:-80px;right:-60px}
        .logo{width:84px;height:84px;border-radius:22px;margin-bottom:1.6rem;
            box-shadow:0 12px 40px rgba(0,212,170,.18)}
        h1{font-size:2rem;font-weight:800;letter-spacing:-.02em;margin-bottom:.5rem}
        h1 .grad{background:linear-gradient(135deg,var(--g1),var(--g2));
            -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
        p.sub{color:var(--dim);font-size:1.05rem;max-width:420px;margin:0 auto 2.2rem}
        .btn{display:inline-flex;align-items:center;gap:.6rem;padding:.9rem 1.6rem;
            border-radius:999px;font-weight:700;font-size:1rem;text-decoration:none;
            background:linear-gradient(135deg,var(--g1),var(--g2));color:#04121a;
            transition:transform .18s,box-shadow .18s;box-shadow:0 8px 24px rgba(0,212,170,.22)}
        .btn:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(0,212,170,.32)}
        footer{position:fixed;bottom:1.4rem;left:0;right:0;text-align:center;
            color:var(--dim);font-size:.82rem}
        footer a{color:var(--dim);text-decoration:none;margin:0 .5rem}
        footer a:hover{color:var(--accent)}
    </style>
</head>
<body>
    <div class="bg"><div class="orb orb-1"></div><div class="orb orb-2"></div></div>

    <img class="logo" src="ttm_f_logo.png" alt="ToolToolNam">
    <h1>ToolToolNam<br><span class="grad">Simple Android Apps</span></h1>
    <p class="sub">Lightweight apps that each do one thing well. No clutter, no bloat.</p>
    <a class="btn" href="https://play.google.com/store/apps/developer?id=ToolToolNam" target="_blank" rel="noopener">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M3.609 1.814L13.792 12 3.61 22.186a.996.996 0 0 1-.61-.92V2.734a1 1 0 0 1 .609-.92zm10.89 10.893l2.302 2.302-10.937 6.333 8.635-8.635zm3.199-3.198l2.807 1.626a1 1 0 0 1 0 1.73l-2.808 1.626L15.206 12l2.492-2.491zM5.864 2.658L16.802 8.99l-2.303 2.303-8.635-8.635z"/></svg>
        View on Google Play
    </a>

    <footer>
        &copy; 2026 ToolToolNam
        <a href="mailto:tooltoolnam@gmail.com">Contact</a>
    </footer>
</body>
</html>
